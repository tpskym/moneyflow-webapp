<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MoneyFlow" />
    <title>MoneyFlow</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/moneyflow.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/moneyflow.svg" />
    <link rel="stylesheet" href="styles.css?v=51" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header-heading">
          <p class="eyebrow">Личный счёт</p>
          <h1>MoneyFlow</h1>
          <p class="subtitle">Учет доходов и расходов <span class="app-version">v50</span></p>
        </div>
        <div class="header-tools">
          <button
            type="button"
            id="sync-settings-toggle"
            class="btn btn--small btn--secondary sync-toggle"
            aria-label="Открыть настройки синхронизации"
            title="Открыть настройки синхронизации"
          >
            <span class="btn-icon" aria-hidden="true">⚙️</span>
            <span class="sr-only">Открыть настройки синхронизации</span>
          </button>
        </div>
        <div class="sync-actions">
          <button type="button" id="cloud-upload-top" class="btn btn--small sync-button-with-icon" aria-label="Выгрузить в облако" title="Выгрузить в облако">
            <span>Выгрузить</span>
          </button>
          <button type="button" id="cloud-download-top" class="btn btn--small sync-button-with-icon" aria-label="Загрузить из облака" title="Загрузить из облака">
            <span>Загрузить</span>
          </button>
          <button
            type="button"
            id="quick-add-toggle"
            class="btn btn--small quick-add-toggle"
            aria-label="Открыть быстрое добавление"
            title="Открыть быстрое добавление"
          >
            <span>Быстрое добавление</span>
          </button>
        </div>
      </header>

      <main>
        <section class="card sync-card" id="sync-settings-section" hidden>
          <h2>Google Drive</h2>
          <label class="field">
            OAuth Client ID
            <input id="google-client-id" type="text" autocomplete="off" placeholder="...apps.googleusercontent.com" />
          </label>
          <label class="field">
            ID файла в Google Drive
            <input id="google-file-id" type="text" autocomplete="off" placeholder="Будет создан при первой выгрузке" />
          </label>
          <label class="field">
            Режим устройства
            <select id="cloud-access-mode">
              <option value="writer">Веду данные: загрузка и выгрузка</option>
              <option value="reader">Только чтение из облака</option>
            </select>
          </label>
          <div class="sync-buttons">
            <button id="cloud-save" type="button" class="btn btn--secondary">Сохранить настройки</button>
            <button id="cloud-download" type="button" class="btn btn--secondary">Загрузить из облака</button>
            <button id="cloud-upload" type="button" class="btn">Выгрузить в облако</button>
            <button id="cloud-clear-data" type="button" class="btn btn--danger">Очистить локальные данные</button>
          </div>
          <div class="muted">Выгрузка полностью заменяет файл в облаке. Загрузка полностью заменяет данные на этом устройстве.</div>
          <div id="cloud-status" class="muted" aria-live="polite"></div>
        </section>

        <section class="card quick-add-card" id="quick-add-card" hidden>
          <h2 id="quick-add-title">Быстрое добавление</h2>
          <form id="operation-form" class="form-grid" autocomplete="off">
            <label class="field field-wide">
              Тип
              <div id="operation-type-toggle" class="type-toggle" role="radiogroup" aria-label="Тип операции">
                <button type="button" class="type-option chip active" data-type="income">Доход</button>
                <button type="button" class="type-option chip" data-type="expense">Расход</button>
              </div>
              <input type="hidden" id="operation-type" value="income" required />
            </label>
            <div class="field field-wide">
              <span>Сумма</span>
              <output id="operation-amount-display" class="amount-display" aria-live="polite">0</output>
              <input id="operation-amount" type="hidden" value="" />
              <div id="amount-keypad" class="amount-keypad" aria-label="Цифровая клавиатура суммы">
                <button type="button" class="btn" data-amount-key="1">1</button>
                <button type="button" class="btn" data-amount-key="2">2</button>
                <button type="button" class="btn" data-amount-key="3">3</button>
                <button type="button" class="btn" data-amount-key="4">4</button>
                <button type="button" class="btn" data-amount-key="5">5</button>
                <button type="button" class="btn" data-amount-key="6">6</button>
                <button type="button" class="btn" data-amount-key="7">7</button>
                <button type="button" class="btn" data-amount-key="8">8</button>
                <button type="button" class="btn" data-amount-key="9">9</button>
                <button type="button" class="btn" data-amount-key=".">,</button>
                <button type="button" class="btn" data-amount-key="0">0</button>
                <button type="button" class="btn btn--secondary" data-amount-action="backspace">Del</button>
              </div>
            </div>
            <div class="field field-wide">
              <span>Категория</span>
              <div class="category-picker" id="category-picker">
                <input id="operation-category-input" type="text" autocomplete="off" placeholder="Выберите категорию" readonly />
                <button type="button" id="category-picker-toggle" class="btn btn--small picker-toggle">▾</button>
              </div>
              <input type="hidden" id="operation-category" required />
              <div id="category-picker-popover" class="category-picker-popover" hidden>
                <button type="button" id="category-create-toggle" class="category-picker-option category-picker-option--add category-create-toggle">
                  <span class="category-picker-add-mark">+</span>
                  <span>Добавить категорию</span>
                </button>
                <div id="category-create-form" class="category-create-form" hidden>
                  <label class="sr-only" for="category-create-name">Название новой категории</label>
                  <input id="category-create-name" type="text" autocomplete="off" placeholder="Название категории" />
                  <div class="category-create-actions">
                    <button type="button" id="category-create-save" class="btn">Сохранить</button>
                    <button type="button" id="category-create-cancel" class="btn btn--secondary">Отмена</button>
                  </div>
                </div>
                <div id="category-picker-list" class="category-picker-list" aria-live="polite"></div>
              </div>
            </div>
            <label class="field field-wide">
              Описание
              <textarea id="operation-description" rows="2" placeholder="Например: продуктовый магазин"></textarea>
            </label>
            <label class="field">
              Дата
              <input id="operation-date" type="text" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="ДД.ММ.ГГГГ" required />
            </label>
            <div class="sync-buttons field-wide" id="quick-add-actions">
              <button id="operation-submit" type="submit" class="btn btn--primary">Добавить</button>
              <button id="quick-add-dismiss" type="button" class="btn btn--secondary">Отменить</button>
            </div>
          </form>
        </section>

        <div class="overview-divider" aria-hidden="true"><span>Состояние счёта</span></div>

        <section class="card overview-card">
          <h2>Баланс</h2>
          <div class="summary">
            <article>
              <p id="balance-title">Текущий остаток</p>
              <strong id="balance-current">0 ₽</strong>
            </article>
          </div>
        </section>

        <section class="card overview-card">
          <div class="operations-toolbar">
            <h2>Операции</h2>
            <button id="search-toggle" type="button" class="btn btn--secondary search-toggle" aria-expanded="false" aria-label="Открыть поиск" title="Открыть поиск">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="10.5" cy="10.5" r="5.5"></circle>
                <path d="m15 15 5 5"></path>
              </svg>
              <span class="sr-only">Открыть поиск</span>
            </button>
          </div>
          <div class="search" id="search-section">
            <div id="search-field" class="search-field" hidden>
              <label class="field">
                Поиск
                <input id="search-input" type="search" inputmode="search" placeholder="По описанию, категории или сумме" />
              </label>
            </div>
            <div id="search-filters" class="search-filters" hidden>
              <div id="year-filters" class="year-filters" role="tablist" aria-label="Фильтр по году"></div>

              <div class="chips" role="tablist" aria-label="Фильтр по типу">
                <button type="button" class="chip active" data-type="all">Все</button>
                <button type="button" class="chip" data-type="income">Доход</button>
                <button type="button" class="chip" data-type="expense">Расход</button>
              </div>

              <div id="category-filters" class="category-filters" role="group" aria-label="Фильтр по категориям"></div>
            </div>
          </div>

          <div id="operations-list" class="operations-list" aria-live="polite"></div>

          <div class="pagination">
            <button id="load-more-operations" class="btn">Загрузить ещё</button>
          </div>
        </section>
      </main>
    </div>

    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="app.js?v=51" defer></script>
  </body>
</html>
